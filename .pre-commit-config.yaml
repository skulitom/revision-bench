# Install with: uv run pre-commit install
#
# Deliberately lightweight. The heavy checks (pytest, the offline corpus rebuild) live in
# CI: a pre-commit hook slow enough to be worth skipping is a hook that gets skipped.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        # Corpus and result artifacts are byte-frozen (see .gitattributes): appending a
        # newline to a passage would change its text_sha256 and orphan every metric row
        # computed from it.
        exclude: ^(data/corpus/|results/)
      - id: trailing-whitespace
        exclude: ^(data/corpus/|results/)
      - id: check-added-large-files
        args: [--maxkb=512]
