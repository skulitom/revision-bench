# Phase-0 corpus: 10 Stratum-A passages, 3 authors (plan.md §9 Phase 0, §14 M0-a).
#
# Author selection is doing three jobs at once, and each is deliberate:
#
#   1. Maximal stylistic contrast between the two famous authors. Woolf and Hemingway are
#      the extremes plan.md §5 names -- fluid/subordinated/dash-heavy against
#      terse/coordinated/declarative. If a revision loop pulls text toward a single house
#      style (plan.md §4, H1), these two are where it should be most visible.
#
#   2. A contamination control (plan.md §5, §12.6). Dorothy Richardson wrote in the same
#      period and in the same stream-of-consciousness mode as Woolf -- Pilgrimage predates
#      Mrs. Dalloway by a decade -- but is far less read: at the time of writing, Project
#      Gutenberg reports 658 downloads for Pointed Roofs against 30,616 for Mrs. Dalloway,
#      a ~46x gap. So Woolf/Richardson is a near-matched pair on style and era that differs
#      chiefly in how much of it a model is likely to have memorised. If the famous and
#      obscure passages behave the same under revision, memorisation is not driving the
#      result; if they diverge, §5's memorisation probe has something to explain.
#
#   3. Richardson doubles as a second "fluid" voice, so Woolf-vs-Richardson (similar) and
#      Woolf-vs-Hemingway (extreme) give two different starting distances for M2's
#      homogenization curve to close.
#
# All three works are in the public domain in the United States.
#
# The expected_sha256 values are pinned against the exact files fetched on 2026-08-11.
# A mismatch is a hard error, not a warning: Project Gutenberg re-issues files (the
# Mrs. Dalloway file records "Most recently updated: August 4, 2026"), and a re-issue can
# move or re-typeset the text an anchor points at. Re-verify the passages before repinning.

version: 1
description: >-
  Phase-0 Stratum-A corpus: 10 passages of ~900 words from three authors, two famous and
  one obscure, for the unconstrained-loop degradation replication.

extraction:
  # plan.md §5: passages are 500-1500 words. The targets below sit mid-range: long enough
  # for stylometry to have signal (plan.md §12.2 flags this as untested), short enough
  # that a 10-round loop on a local model stays cheap in wall-clock.
  min_words: 500
  max_words: 1500
  complete_paragraph_slack_frac: 0.2

sources:
  - key: woolf-dalloway
    ebook_id: 71865
    author_id: woolf
    author_display: Virginia Woolf
    fame: famous
    title_hint: Mrs. Dalloway
    expected_sha256: 949709f2afc38690e88703238b24d3f521d627ebacccf8ac82f972a82d4a622b

  - key: hemingway-sun
    ebook_id: 67138
    author_id: hemingway
    author_display: Ernest Hemingway
    fame: famous
    title_hint: The Sun Also Rises
    expected_sha256: 4b9699c31be25f62d644468926d716165402d2d363ca4af64312839f6e63534e

  - key: richardson-pointed
    ebook_id: 3019
    author_id: richardson
    author_display: Dorothy M. Richardson
    fame: obscure
    title_hint: "Pointed Roofs (Pilgrimage, Volume 1)"
    expected_sha256: f22a8397060a00909dd8efb5fcbf720833aeb941957067db9f2e851f7da1f4eb

# Anchors are the shortest prefix of the target paragraph that occurs exactly once in the
# book body, derived mechanically rather than typed by hand -- a non-unique anchor would
# make the cut ambiguous, and extract_passage rejects it. They are matched literally
# against un-normalised source text, so the "--" and curly quotes below are significant.
