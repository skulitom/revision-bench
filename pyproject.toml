[project]
name = "revision-bench"
version = "0.0.0.dev0"
description = "An open study of revision-loop dynamics in LLMs: when iterative prose revision degrades text, and which loop architectures make it non-degrading."
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# Deliberately small. plan.md §7 states that M1-M3 and M6 are "pure Python, zero API
# cost", and that property is worth protecting: the metrics half of this repo must stay
# installable and runnable on a laptop with no GPU, no API key and no network, or the
# "metrics recomputable from artifacts alone" acceptance criterion (plan.md §9, Phase 0)
# quietly stops being testable.
#
# Nothing for the reviser/judge API clients is listed yet. They arrive with M0-c, whose
# milestone owns the decision of which SDKs to pin. An absent dependency is honest; one
# added "so it is ready" invites code to be written against it out of milestone order.
dependencies = [
    "numpy",
    "pyyaml",
    # Corpus fetching and the local Ollama HTTP API. urllib would do, but `requests` gets
    # us connection reuse and sane timeout semantics.
    "requests",
    # Phase figures (plan.md §14 M0-c). Kept in the core dependencies rather than an extra
    # so that "one command reproduces the figures" stays true.
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.2,<0.17",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Flat layout, matching MirrorBench: the importable package is the top-level
# `revisionbench/` directory.
[tool.hatch.build.targets.wheel]
packages = ["revisionbench"]

[tool.ruff]
line-length = 100
target-version = "py313"
# plan.md and the docs quote external sources and illustrative snippets; reformatting
# fenced Python inside them would silently edit reference material.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifiable constructs
    "C4",   # comprehensions
    "BLE",  # blind except: an error you cannot name is one you cannot advise on
    "PTH",  # prefer pathlib; Windows dev, Linux CI
    "RUF",  # ruff-specific
]
ignore = [
    # Docstrings and comments here quote plan.md section marks (§), en/em dashes and
    # author names with diacritics. Prose is not parsed; flattening it to ASCII buys
    # nothing. RUF001 stays ON, because a lookalike character inside a string literal or
    # identifier is a real, silent hazard -- and this repo's string literals include a
    # slop lexicon and a punctuation profile, where U+2019 vs U+0027 changes a number.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately contain long verbatim prose passages; wrapping them would
# change the sentence-length and punctuation profiles the tests assert on.
"tests/**" = ["E501"]

# RUF001 (ambiguous character in a *string literal*) stays on globally because a stray
# lookalike inside a literal is a genuine silent hazard. These files are the exception
# that proves it: their subject matter IS the set of typographic lookalikes. text.py
# enumerates the fold table (U+2019 -> ', U+201C -> ", en dash vs em dash vs hyphen), the
# slop matcher and corpus anchors are compared against curly-quoted source text, and the
# tests assert that each variant lands in the right class. Every flagged character in
# them is the point of the line it appears on, so the rule can only produce noise here —
# and noise is what gets a useful rule switched off everywhere.
"revisionbench/text.py" = ["RUF001"]
"revisionbench/corpus.py" = ["RUF001"]
"revisionbench/metrics/slop.py" = ["RUF001"]
"tests/test_text.py" = ["RUF001"]
"tests/test_thrash.py" = ["RUF001"]
"tests/test_loop.py" = ["RUF001"]
"tests/test_slop.py" = ["RUF001"]
"tests/test_records.py" = ["RUF001"]
"tests/test_config.py" = ["RUF001"]
"tests/test_corpus.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["revisionbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline and hermetic (see AGENTS.md §3). Anything that needs the network belongs
# behind the `network` marker and outside the default run.
addopts = "-ra --strict-markers --strict-config -m 'not network'"
markers = [
    "network: hits gutenberg.org; excluded from the default run and from CI",
]
